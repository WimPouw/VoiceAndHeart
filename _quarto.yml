project:
  output-dir: docs
  type: website

website:
  sidebar:
    style: "floating"
    search: false
    contents:
      - section: "Extended Results"
        contents:
          - text: "Heart pulses and vocalization"
            href: heartrate.html
          - text: "Heart pulses and expiration"
            href: heartrate_expire.html

metadata:
  crossref:
    chapters: true

bibliography: quarto_dependencies/references/references.bib
theme: journal

format:
  html:
    toc: true
    fontsize: 12px
    max-width: 8000px
    toc-location: left
    toc-title: "Contents"
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: true
    css: |
      .quarto-container {
        max-width: 8000px !important;
      }
      body {
        font-size: 10px;
      }

engine: quarto